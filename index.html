<!DOCTYPE html>
<html>
<head>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>mood Clicker</title>
<style>
  body {
    text-align: center;
    font-family: Arial;
    background: #1a1a1a;
    color: white;
    padding-top: 50px;
  }
  button {
    background: #ff00ff;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 10px;
  }
  #mood {
    font-size: 24px;
    margin-top: 20px;
  }
</style>
</head>
<body>
  <h1>Hello mood</h1>
  <button>Click me</button>
  <p id="mood">mood: Happy</p>
<script>
   let moods = ["Happy", "Excited", "DJ 6ixe", "Coding", "Younger"];
   let i = 0;
   
  document.querySelector("button").onclick = function() {
   i = i + 1;
     if(i >= moods.length) i = 0;
     document.getElementById("mood").innerHTML = "mood: " + moods[i];
  }
</script>
</body>
</html>
